services:
  tt_bot:
    build: .
    container_name: tt_bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_PATH: /data/tt_bot.db
      LOG_FORMAT: json
    volumes:
      - tt_bot_data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  tt_bot_data:
