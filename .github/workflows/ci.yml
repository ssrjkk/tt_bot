name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check
      - name: Lint
        run: python -m flake8 src tests --count --max-complexity=10 --max-line-length=120 --statistics
      - name: Check formatting
        run: python -m black --check --line-length=88 src tests
      - name: Test without inherited credentials or external connections
        run: >-
          env -i PATH="$PATH" HOME="$RUNNER_TEMP" LANG=C.UTF-8
          PYTHON_DOTENV_DISABLED=1
          python -m pytest tests/ -v --cov=src --cov-report=xml
          --allow-hosts=127.0.0.1,::1 --allow-unix-socket
      - name: Audit installed dependencies
        run: python -m pip_audit --strict
